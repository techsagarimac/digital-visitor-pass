{% extends "base.html" %}
{% block title %}Verify Pass{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="page-card">
          <h1 class="h3">Verify a visitor pass</h1>
          <p class="text-muted">Enter a Pass ID, or scan the QR code with a phone camera. The QR opens this page automatically.</p>
          <form method="post" action="{{ url_for('verification.verify_form') }}">
            <label class="form-label" for="pass_id">Pass ID</label>
            <input class="form-control form-control-lg" type="text" id="pass_id" name="pass_id" placeholder="VIS-2026-00001" required>
            <button class="btn btn-primary mt-3" type="submit">Verify</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
