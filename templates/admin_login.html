{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="page-card">
          <h1 class="h3">Admin login</h1>
          <p class="text-muted small">Demo credentials (change before any real deployment): <strong>admin</strong> / <strong>admin123</strong></p>
          <form method="post">
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input class="form-control" type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
